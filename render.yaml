# Render Blueprint for Eastern Paradise
# Deploys as a native Node.js web service on the Free plan.
# SQLite DB lives on the instance's ephemeral disk (resets on redeploy/restart).
services:
  - type: web
    name: eastern-paradise
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && bash scripts/setup_puzzle_engine.sh
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22" # latest v22 LTS (>=22.13 required: node:sqlite is flag-free there)
      # Real sponsor-email delivery (optional). Set RESEND_API_KEY or SMTP_URL as a secret in the
      # Render dashboard. With none set, the server falls back to console mode.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Eastern Paradise <sanctuary@simulation.cryptgregresearch.org>"
      - key: MAIL_ALLOWED_SPONSOR_DOMAINS
        value: "*"
      - key: SMTP_URL
        sync: false
      # Groq Cloud API for NPC A.Ilicia live LLM responses
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "allam-2-7b"
      # Turso LibSQL Cloud Persistence
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Solana Devnet land settlement. Keep the treasury public-only; store the
      # restricted issuer secret only in Render's encrypted environment settings.
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_RPC_URL
        sync: false
      - key: SOLANA_NFT_PROVIDER
        value: mock
      - key: SOLANA_NFT_ISSUER_SECRET
        sync: false
      - key: SOLANA_TREASURY_ADDRESS
        sync: false
      - key: SOLANA_LAND_COLLECTION_ADDRESS
        sync: false
      - key: SOLANA_SOL_USD_PRICE
        value: "0"
      # Persistent SQLite: requires a paid plan (Starter, $7/mo) + disk ($0.25/GB/mo).
      # To activate: uncomment the disk block below, set plan: starter, and uncomment DATA_DIR.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: paradise-data
    #   mountPath: /var/data
    #   sizeGB: 1
