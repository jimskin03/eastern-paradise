# Render Blueprint for Eastern Paradise
# Deploys as a native Node.js web service on the Free plan.
# SQLite DB lives on the instance's ephemeral disk (resets on redeploy/restart).
services:
  - type: web
    name: eastern-paradise
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.11.0
