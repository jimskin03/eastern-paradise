# Render Blueprint for Eastern Paradise
# Deploys as a native Node.js web service on the Free plan.
# SQLite DB lives on the instance's ephemeral disk (resets on redeploy/restart).
services:
  - type: web
    name: eastern-paradise
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci && npm run build:wallet && bash scripts/setup_puzzle_engine.sh
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22" # latest v22 LTS (>=22.13 required: node:sqlite is flag-free there)
      # Real sponsor-email delivery (optional). Set RESEND_API_KEY or SMTP_URL as a secret in the
      # Render dashboard. With none set, the server falls back to console mode.
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Eastern Paradise <sanctuary@simulation.cryptgregresearch.org>"
      - key: MAIL_ALLOWED_SPONSOR_DOMAINS
        value: "*"
      - key: SMTP_URL
        sync: false
      # Groq Cloud API for NPC A.Ilicia live LLM responses
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "allam-2-7b"
      # Turso LibSQL Cloud Persistence
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # ---- Solana land settlement ----
      # Network is devnet by default and MAINNET IS DELIBERATELY DISABLED (loadSolanaConfig
      # throws unless SOLANA_ALLOW_MAINNET=true). To go live on mainnet, set BOTH in the Render
      # DASHBOARD (not this file, so the repo default stays safe) AFTER the mainnet secrets below
      # are in place:  SOLANA_NETWORK=mainnet-beta, SOLANA_ALLOW_MAINNET=true, and a MAINNET
      # SOLANA_RPC_URL. The gate + foot-gun guard reject a devnet RPC for mainnet and vice-versa,
      # so do NOT flip the network before SOLANA_RPC_URL / SOLANA_NFT_ISSUER_SECRET /
      # SOLANA_LAND_COLLECTION_ADDRESS / SOLANA_TREASURY_ADDRESS are mainnet-correct, or startup
      # throws. ROLLBACK = set SOLANA_NETWORK back to devnet and SOLANA_ALLOW_MAINNET to false.
      - key: SOLANA_NETWORK
        value: devnet
      - key: SOLANA_ALLOW_MAINNET
        value: "false" # deliberate opt-in; repo default is devnet-only
      - key: SOLANA_RPC_URL
        sync: false # mainnet: https://api.mainnet-beta.solana.com (public, rate-limited) or Helius/QuickNode
      - key: SOLANA_NFT_PROVIDER
        sync: false # mock | solana (solana enables real land minting)
      - key: SOLANA_NFT_ISSUER_SECRET
        sync: false # 64-byte JSON array OR base58; MAINNET = dedicated funded BURNER only
      - key: SOLANA_TREASURY_ADDRESS
        value: "344ukhxSCRFVgjUstqxWkjfM8gMxofqxZU6o1mEqGZ3t" # PUBLIC-only wallet; no secret in repo
      - key: SOLANA_LAND_COLLECTION_ADDRESS
        value: "BMUj4RKqfHYzmxGysLVoucZsgACFHAaMczqh3nbbuBpW" # Mainnet Metaplex Core collection
      - key: SOLANA_USDC_MINT
        sync: false # optional override; defaults to devnet/mainnet USDC by network
      - key: SOLANA_SOL_USD_PRICE
        value: "0" # set non-zero for real USD valuation (static value, not a live oracle)
      # Persistent SQLite: requires a paid plan (Starter, $7/mo) + disk ($0.25/GB/mo).
      # To activate: uncomment the disk block below, set plan: starter, and uncomment DATA_DIR.
      # - key: DATA_DIR
      #   value: /var/data
    # disk:
    #   name: paradise-data
    #   mountPath: /var/data
    #   sizeGB: 1
