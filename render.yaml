# Render Blueprint for Eastern Paradise (BSC/EVM)
services:
  - type: web
    name: eastern-paradise
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      # BSC testnet is the safe default. Mainnet requires BSC_ALLOW_MAINNET=true.
      - key: BSC_NETWORK
        value: "testnet"
      - key: BSC_RPC_URL
        value: "https://bsc-testnet-dataseed.bnbchain.org"
      - key: BSC_ALLOW_MAINNET
        value: "false"
      - key: BSC_TREASURY_ADDRESS
        sync: false
      - key: BSC_NFT_PROVIDER
        value: "mock"
      - key: BSC_NFT_ISSUER_PRIVATE_KEY
        sync: false
      - key: BSC_LAND_COLLECTION_ADDRESS
        sync: false
      - key: BSC_ALLOW_MOCK_LAND_PURCHASES
        value: "false"
      - key: PUBLIC_BASE_URL
        value: "https://simulation.cryptgregresearch.org"
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        value: "Eastern Paradise <sanctuary@simulation.cryptgregresearch.org>"
      - key: MAIL_ALLOWED_SPONSOR_DOMAINS
        value: "*"
      - key: SMTP_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: "allam-2-7b"
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
